# Dùng file này KHI VPS ĐÃ CÓ NGINX (nếu không thì lệnh cài sẽ tự dùng Caddy, không cần file này).
# 1) Chạy lệnh cài trước để app chạy ở 127.0.0.1:3000:   sudo bash deploy/cai-dat-vps.sh chat.tenmien.com
# 2) Sửa "chat.tenmien.com" bên dưới, chép file vào /etc/nginx/sites-available/ctv-chat
#    rồi:  sudo ln -s /etc/nginx/sites-available/ctv-chat /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# 3) Lấy chứng chỉ HTTPS:  sudo apt install -y certbot python3-certbot-nginx && sudo certbot --nginx -d chat.tenmien.com
server {
    listen 80;
    server_name chat.tenmien.com;
    client_max_body_size 500m;            # khôi phục bản sao lưu (.sqlite) có thể lớn

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;              # tin nhắn thời gian thực (Server-Sent Events)
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
